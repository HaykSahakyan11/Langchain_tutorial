[project]
name = "system-one-models"
version = "0.1.0"
description = "System One models — Jev and the LangChain TypeSafe integration"
readme = "README.md"
authors = [{ name = "Hayk Sahakyan", email = "hayk.ashoti.sahakyan@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langchain-typesafe[experimental]>=0.0.1",
    "langsmith>=0.14.8",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
