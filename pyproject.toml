[project]
name = "evaluating-jev"
version = "0.1.0"
description = "Evaluating Jev — can its confidence be trusted to let the AutoMode gate act alone?"
readme = "README.md"
authors = [{ name = "Hayk Sahakyan", email = "hayk.ashoti.sahakyan@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "langchain-typesafe[experimental]>=0.0.1",
    "langsmith>=0.14.17",
    "matplotlib>=3.11.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.2.0",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
