[project]
name = "agent-middleware"
version = "0.1.0"
description = "Agent middleware with LangChain: observe, guard, and steer the agent loop"
readme = "README.md"
authors = [{ name = "Hayk Sahakyan", email = "hayk.ashoti.sahakyan@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
